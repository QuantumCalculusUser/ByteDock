services:
  - type: web
    name: bytedock-api
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_MODEL
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: EXECUTION_ENABLED
        value: "false"
      - key: JUDGE0_BASE_URL
        value: https://ce.judge0.com
      - key: JUDGE0_PYTHON_LANGUAGE_ID
        value: "71"
      - key: JUDGE0_JAVASCRIPT_LANGUAGE_ID
        value: "63"
